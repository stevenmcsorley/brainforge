[project]
name = "brainforge-sim-worker"
version = "0.1.0"
description = "BrainForge Simulation Worker — picks jobs from Redis and runs simulations"
requires-python = ">=3.12"

[project.dependencies]
numpy = ">=1.26.0"
scipy = ">=1.12.0"
networkx = ">=3.2"
xarray = ">=2024.1.0"
pandas = ">=2.2.0"
torch = ">=2.2.0"
pydantic = ">=2.6.0"
redis = ">=5.0.0"
requests = ">=2.31.0"
msgpack = ">=1.0.7"
aiohttp = ">=3.9.0"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[tool.setuptools.packages.find]
where = ["."]
include = ["sim_worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
